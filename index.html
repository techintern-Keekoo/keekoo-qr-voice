<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Room Service Menu</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#1f1f1f;--mute:#6b6b6b;--line:#ece6dc;--brand:#ef5a24;--green:#3a9b3a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:90px}
header{background:var(--brand);color:#fff;padding:16px 16px 12px}
header h1{margin:0;font-size:22px}header .sub{font-size:13px;opacity:.9}
.room{display:inline-block;margin-top:6px;background:rgba(0,0,0,.2);padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.search{padding:10px 16px 6px}.search input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-size:15px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:6px 16px 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 12px;font-size:13px}
.tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
main{max-width:720px;margin:0 auto;padding:0 16px}
h2{font-size:17px;margin:20px 0 8px;color:var(--brand)}
.item{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.item .info{flex:1;min-width:0}.item .n{font-weight:600}.item .p{font-weight:700;margin-top:2px}
.add{border:1.5px solid var(--brand);color:var(--brand);background:transparent;font-weight:700;border-radius:8px;padding:6px 16px}
.item.off{opacity:.55}.item .offt{font-size:12px;color:var(--mute);margin-top:2px}.add:disabled{border-color:var(--mute);color:var(--mute);cursor:not-allowed}
.qty{display:flex;align-items:center;border:1.5px solid var(--brand);border-radius:8px;overflow:hidden}
.qty button{border:0;background:var(--brand);color:#fff;width:30px;height:32px;font-size:18px}.qty span{min-width:28px;text-align:center;font-weight:700}
.cartbar{position:fixed;left:12px;right:12px;bottom:12px;max-width:696px;margin:0 auto;background:var(--green);color:#fff;border-radius:14px;padding:12px 16px;display:none;justify-content:space-between;align-items:center;font-weight:600;box-shadow:0 6px 20px rgba(0,0,0,.25);border:0;font-size:15px;width:calc(100% - 24px)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:10;align-items:flex-start}
.sheet .box{background:var(--card);width:100%;max-width:720px;margin:0 auto;border-radius:0 0 16px 16px;padding:16px;max-height:100%;overflow:auto}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.row .l{flex:1}.tot{display:flex;justify-content:space-between;font-size:18px;font-weight:800;margin-top:12px}
textarea{width:100%;margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.btn{width:100%;margin-top:12px;background:var(--brand);color:#fff;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn:disabled{opacity:.6}
.note{font-size:12px;color:var(--mute);margin-top:8px;text-align:center}.empty{color:var(--mute);text-align:center;padding:30px}
.login{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;align-items:center;justify-content:center;padding:16px}.lbox{background:var(--card);width:100%;max-width:420px;border-radius:16px;padding:20px;box-shadow:0 6px 20px rgba(0,0,0,.12)}.lbox input{width:100%;margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:16px}
.nwrap{position:relative}.nwrap textarea{padding-right:54px}
.micb{position:absolute;right:6px;bottom:6px;width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:#555;padding:0;display:flex;align-items:center;justify-content:center;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.micb.rec{background:#d32f2f;color:#fff;transform:scale(1.15)}.micb.ok{color:var(--green)}
.vline{font-size:12px;color:var(--mute);margin-top:4px;min-height:16px;display:flex;align-items:center;gap:10px}
.vline.rec{color:#d32f2f;font-weight:600}.vline button{border:0;background:transparent;color:var(--brand);font-weight:700;font-size:12px;padding:2px 0}
</style></head><body>
<header><h1>Room Service</h1><div class="sub">Order from your room · Please allow ~30 min</div><div class="room" id="roomTag"></div></header>
<div class="bar"><div class="search"><input id="q" placeholder="Search dishes…"></div><nav class="tabs" id="tabs"></nav></div>
<main id="list"></main>
<button class="cartbar" id="cartbar"><span id="cb1"></span><span>View order →</span></button>
<div class="sheet" id="sheet"><div class="box" id="box"></div></div>
<div class="login" id="login"><div class="lbox"><h2 style="margin:0 0 4px">Welcome</h2><div class="note" style="text-align:left;margin:0 0 6px">Please enter your details to order</div><input id="gName" placeholder="Full name" maxlength="60" autocomplete="name"><input id="gPhone" type="tel" placeholder="10-digit mobile number" inputmode="numeric" maxlength="10" autocomplete="tel"><div id="gErr" class="note" style="color:var(--brand)"></div><button class="btn" id="gGo">Continue to menu</button></div></div>
<script>
// Same Apps Script web app as before (menu, login, orders -> KDS, voice notes).
const API='https://script.google.com/macros/s/AKfycbzEEPwyQK2GU2_QaPstoUzwXfIPn-L5BtRnsKV1UwmwZO7nUdjjYZ53y3GTFschaJYNhA/exec';
function api(body,tries){tries=tries===undefined?(body.api==='order'?0:1):tries; // orders never auto-retry (no double orders)
return fetch(API,{method:'POST',body:JSON.stringify(body)}).then(r=>r.json(),e=>{if(tries>0)return new Promise(z=>setTimeout(z,1200)).then(()=>api(body,tries-1)).then(j=>({ok:true,...j}));throw new Error('Network problem. Please check your connection and try again.')})
.then(j=>{if(!j.ok)throw new Error(j.error||'Please try again.');return j})}

let MENU=[],all=[],CUR=0;
const $=s=>document.querySelector(s);const cart={};const rs=n=>'₹'+Number(n).toLocaleString('en-IN');
const esc=s=>String(s).replace(/[<>"']/g,'');
const QS=new URLSearchParams(location.search);
const ROOM=String(QS.get('room')||'').replace(/[^A-Za-z0-9-]/g,'').slice(0,8);
const KEY=String(QS.get('k')||'').replace(/[^A-Za-z0-9_-]/g,'').slice(0,16); // optional secret room code
const TXN=String(QS.get('txn')||'').replace(/[^A-Za-z0-9]/g,'').slice(0,44); // back from PayU
let PAY=false; // does this room pay before ordering? (server decides: payMode)
function showRoom(){$('#roomTag').textContent=ROOM?'Room '+ROOM:'Please scan the QR code in your room'}showRoom();
function hrs(s){if(!s)return '';return s.split('-').map(t=>{let[H,M]=t.split(':').map(Number);const ap=H>=12?'PM':'AM';H=H%12||12;return H+(M?':'+String(M).padStart(2,'0'):'')+' '+ap}).join(' – ')}
function buildAll(){all=[];MENU.forEach((c,ci)=>c.items.forEach((it,ii)=>all.push({id:ci+'-'+ii,cat:c.cat,name:it[0],price:it[1],open:it[2]!==false,hours:hrs(it[3])})));}
function render(){const q=$('#q').value.trim().toLowerCase();let h='';
MENU.forEach((c,ci)=>{const its=all.filter(i=>i.cat===c.cat&&(!q||i.name.toLowerCase().includes(q)));if(!its.length||(!q&&ci!==CUR))return;
h+='<h2 id="c-'+ci+'">'+esc(c.cat)+(String(c.cat).trim().toUpperCase()==='BREAKFAST'&&its[0].hours?' · '+esc(its[0].hours):'')+'</h2>';
its.forEach(it=>{const n=cart[it.id]?cart[it.id].qty:0;
h+='<div class="item'+(it.open?'':' off')+'"><div class="info"><div class="n">'+esc(it.name)+'</div><div class="p">'+rs(it.price)+'</div>'+(it.open?'':'<div class="offt">Available '+esc(it.hours)+'</div>')+'</div>'+
(!it.open?'<button class="add" disabled>ADD</button>':n?'<div class="qty"><button data-m="'+it.id+'">−</button><span>'+n+'</span><button data-p="'+it.id+'">+</button></div>':'<button class="add" data-p="'+it.id+'">ADD</button>')+'</div>'});});
$('#list').innerHTML=h||'<div class="empty">No dish found</div>';bar();}
function change(id,d){const it=all.find(i=>i.id===id);if(!it||(d>0&&!it.open))return;if(!cart[id])cart[id]={name:it.name,price:it.price,qty:0};
cart[id].qty+=d;if(cart[id].qty<=0)delete cart[id];render();if($('#sheet').style.display==='flex')openCart();}
function totals(){let c=0,t=0;for(const k in cart){c+=cart[k].qty;t+=cart[k].qty*cart[k].price}return{c,t}}
function bar(){const{c,t}=totals();$('#cartbar').style.display=c?'flex':'none';$('#cb1').textContent=c+' item'+(c>1?'s':'')+' · '+rs(t);}
document.addEventListener('click',e=>{const d=e.target.dataset;if(d.p)change(d.p,1);if(d.m)change(d.m,-1);});
$('#q').oninput=render;
function drawTabs(){$('#tabs').innerHTML=MENU.map((c,ci)=>'<button data-t="'+ci+'"'+(ci===CUR?' class="on"':'')+'>'+esc(c.cat)+'</button>').join('');}
$('#tabs').onclick=e=>{const t=e.target.dataset.t;if(t===undefined)return;CUR=+t;$('#q').value='';render();document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b===e.target));
window.scrollTo({top:0,behavior:'smooth'})};
$('#cartbar').onclick=openCart;$('#sheet').onclick=e=>{if(e.target.id==='sheet')closeCart()};
function closeCart(){$('#sheet').style.display='none'}

// ---- Voice note: tap the mic to start, tap again to stop. Optional. Sent to KDS with the order. ----
const MIC_SVG='<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>';
const CAN_REC=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder);
let V={state:'idle',token:'',url:'',sec:0,err:''}; // idle | rec | up | ok | err
let rec=null,chunks=[],stream=null,timer=null,t0=0,starting=false,upload=null,afterStop=null;
function newToken(){const a=new Uint8Array(12);crypto.getRandomValues(a);return Array.from(a,x=>'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789'[x%56]).join('')}
function pickMime(){for(const m of['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg;codecs=opus'])if(MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(m))return m;return''}
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function vLine(){const el=$('#vline');const b=$('#vRec');if(!el||!b)return;
b.classList.toggle('rec',V.state==='rec');b.classList.toggle('ok',V.state==='ok');el.className='vline'+(V.state==='rec'?' rec':'');
if(V.state==='rec')el.textContent='● Recording '+fmt(V.sec)+' — speak, then just place your order';
else if(V.state==='up')el.textContent='Saving voice note…';
else if(V.state==='ok'){el.innerHTML='✅ Voice note '+fmt(V.sec)+' <button id="vPlay">Play</button><button id="vDel">Remove</button>';$('#vPlay').onclick=()=>new Audio(V.url).play();$('#vDel').onclick=()=>{V={state:'idle',token:'',url:'',sec:0,err:''};upload=null;vLine()};}
else if(V.state==='err')el.textContent=V.err;
else el.textContent=CAN_REC?'🎤 Tap once and tell the chef your request (less spicy, no onion…). Then just place your order.':'';}
function micTap(e){e.preventDefault();if(V.state==='rec'){recStop();return}recStart();} // tap 1 = start, tap 2 = stop
async function recStart(){if(starting||V.state==='rec'||V.state==='up')return;starting=true;
try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(x){starting=false;V={state:'err',err:'Microphone blocked. Allow it in your browser settings, or type your note.'};vLine();return}
starting=false;
const mt=pickMime();try{rec=mt?new MediaRecorder(stream,{mimeType:mt,audioBitsPerSecond:32000}):new MediaRecorder(stream)}catch(x){rec=new MediaRecorder(stream)}
chunks=[];rec.ondataavailable=ev=>{if(ev.data&&ev.data.size)chunks.push(ev.data)};rec.onstop=recDone;rec.start(250);
t0=Date.now();V={state:'rec',token:'',url:'',sec:0,err:''};vLine();
timer=setInterval(()=>{V.sec=Math.floor((Date.now()-t0)/1000);vLine();if(V.sec>=60)recStop()},250);}
function recStop(){if(rec&&rec.state==='recording'){clearInterval(timer);rec.stop()}}
function recDone(){const cb=afterStop;afterStop=null;try{recDone_()}finally{if(cb)cb()}}
function recDone_(){stream.getTracks().forEach(t=>t.stop());const secs=Math.round((Date.now()-t0)/1000);const mime=rec.mimeType||'audio/webm';const blob=new Blob(chunks,{type:mime});
if(secs<1||!blob.size){V={state:'err',err:'Too short. Tap the mic, speak, then tap it again.'};vLine();return}
const token=newToken();V={state:'up',token:token,url:URL.createObjectURL(blob),sec:secs,err:''};vLine();
upload=new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]||'');r.onerror=no;r.readAsDataURL(blob)})
.then(b64=>api({api:'voice',token:token,room:ROOM,k:KEY,mime:mime,seconds:secs,b64:b64}).catch(e=>vVerify(token,e)))
.then(()=>{if(V.token===token){V.state='ok';vLine()}return token})
.catch(x=>{if(V.token===token){V={state:'err',err:'Voice note not saved ('+x.message+'). Tap the mic to try again.'};vLine()}return ''});}
// iPhone Safari sometimes can't read the upload reply even though the note was saved: ask the server.
function vVerify(token,e){let n=0;const chk=()=>api({api:'vstatus',token:token}).then(j=>{if(j.saved)return true;if(++n<3)return new Promise(z=>setTimeout(z,1500)).then(chk);throw e});return chk().catch(()=>{throw e})}
function bindMic(){const b=$('#vRec');if(!b)return;b.addEventListener('click',micTap);b.oncontextmenu=e=>e.preventDefault();vLine();}

function openCart(){const{c,t}=totals();let h='<h3 style="margin:0 0 6px">Your order'+(ROOM?' · Room '+ROOM:'')+'</h3>';
for(const k in cart){const x=cart[k];h+='<div class="row"><div class="l">'+esc(x.name)+'<div style="color:var(--mute);font-size:12px">'+rs(x.price)+' each</div></div><div class="qty"><button data-m="'+k+'">−</button><span>'+x.qty+'</span><button data-p="'+k+'">+</button></div><div style="min-width:64px;text-align:right;font-weight:600">'+rs(x.qty*x.price)+'</div></div>'}
const keep=$('#notes')?$('#notes').value:'';
h+='<div class="row"><span>Total items</span><b>'+c+'</b></div><div class="tot"><span>'+(PAY?'Food total':'Grand Total')+'</span><span>'+rs(t)+'</span></div>'+
'<div class="nwrap"><textarea id="notes" rows="2" maxlength="200" placeholder="Cooking notes (less spicy, no onion…)"></textarea>'+
(CAN_REC?'<button class="micb" id="vRec" aria-label="Tap to start or stop a voice note">'+MIC_SVG+'</button>':'')+'</div><div class="vline" id="vline"></div>'+
(PAY?'<button class="btn" id="place">Pay · see bill with GST</button><button class="btn ghost" id="more">Add more items</button><div class="note">GST is shown on the next screen. Your order goes to the kitchen only after payment.</div>':'<button class="btn" id="place">Place Order · '+rs(t)+'</button><button class="btn ghost" id="more">Add more items</button><div class="note">Taxes, if any, are added on the final bill</div>');
$('#box').innerHTML=h;$('#notes').value=keep;$('#sheet').style.display='flex';$('#place').onclick=place;$('#more').onclick=closeCart;bindMic();}
async function place(){const b=$('#place');if(!ROOM){b.insertAdjacentHTML('afterend','<div class="note" style="color:var(--brand)">Please scan the QR code in your room.</div>');return}
if(V.state==='rec'){b.disabled=true;b.textContent='Saving voice note…';await new Promise(ok=>{afterStop=ok;setTimeout(()=>{if(afterStop===ok){afterStop=null;ok()}},8000);recStop()});b.disabled=false}
const items=Object.values(cart).map(x=>({name:x.name,qty:x.qty}));const notes=$('#notes').value;const{t}=totals();
b.disabled=true;b.textContent=PAY?'Calculating bill…':'Placing order…';
let voice='';if(upload&&(V.state==='up'||V.state==='ok'))voice=await upload;
if(PAY){ // prices + GST come from the server (menu sheet). The page never sends prices.
api({api:'quote',room:ROOM,k:KEY,items:items}).then(q=>payScreen(q,items,notes,voice))
.catch(err=>{b.disabled=false;b.textContent='Try again';b.insertAdjacentHTML('afterend','<div class="note" style="color:var(--brand)">'+esc(err.message)+'</div>')});return}
api({api:'order',room:ROOM,items:items,notes:notes,voice:voice}).then(j=>{const id=j.orderNo;
for(const k in cart)delete cart[k];V={state:'idle',token:'',url:'',sec:0,err:''};upload=null;render();
$('#box').innerHTML='<div style="text-align:center;padding:20px"><div style="font-size:44px">✅</div><h3>Order placed!</h3><p>Room '+ROOM+' · Order #'+esc(id)+'<br>Grand total '+rs(t)+'</p><p class="note">The kitchen has your order. Please allow about 30 minutes.</p><button class="btn" id="dn">Done</button></div>';$('#dn').onclick=closeCart})
.catch(err=>{b.disabled=false;b.textContent='Try again';b.insertAdjacentHTML('afterend','<div class="note" style="color:var(--brand)">'+esc(err.message)+'</div>')});}

// ---- Pay first (PayU). Server signs the payment; the order goes to the kitchen only after PayU confirms. ----
const rs2=n=>'₹'+Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
function payScreen(q,items,notes,voice){const half=q.gstRate/2;
let h='<h3 style="margin:0 0 6px">Your bill · Room '+esc(q.room)+'</h3>';
q.lines.forEach(l=>{h+='<div class="row"><div class="l">'+esc(l.name)+' × '+l.qty+'</div><div style="font-weight:600">'+rs2(l.amount)+'</div></div>'});
h+='<div class="row"><span>Food total</span><b>'+rs2(q.food)+'</b></div>'+
'<div class="row"><span>CGST '+half+'%</span><span>'+rs2(q.cgst)+'</span></div>'+
'<div class="row"><span>SGST '+half+'%</span><span>'+rs2(q.sgst)+'</span></div>'+
'<div class="tot"><span>Total to pay</span><span>'+rs2(q.total)+'</span></div>'+
'<button class="btn" id="payBtn">Proceed to pay '+rs2(q.total)+'</button><button class="btn ghost" id="back">Back</button>'+
'<div class="note">Secure payment by PayU · UPI, cards, net banking. Your order goes to the kitchen after payment.</div>';
$('#box').innerHTML=h;$('#back').onclick=openCart;
$('#payBtn').onclick=()=>{const b=$('#payBtn');const g=getGuest()||{};b.disabled=true;b.textContent='Opening payment…';
api({api:'payStart',room:ROOM,k:KEY,items:items,notes:notes,voice:voice,name:g.name||'',phone:g.phone||''},0).then(j=>{
if(!/^https:\/\/(secure|test)\.payu\.in\/_payment$/.test(j.action))throw new Error('Payment setup error. Please call reception.');
// Browsers only allow leaving the page on a real tap: show a form button (no auto-submit).
const f=document.createElement('form');f.method='POST';f.action=j.action;f.target='_top';
for(const n in j.fields){const i=document.createElement('input');i.type='hidden';i.name=n;i.value=j.fields[n];f.appendChild(i)}
const s=document.createElement('button');s.type='submit';s.className='btn';s.textContent='Continue to secure payment · '+rs2(j.total);f.appendChild(s);
b.replaceWith(f);s.focus()})
.catch(err=>{b.disabled=false;b.textContent='Try again';b.insertAdjacentHTML('afterend','<div class="note" style="color:var(--brand)">'+esc(err.message)+'</div>')})};}
// Back from PayU (?txn=...): ask the server (it checks with PayU) until the order is confirmed or failed.
function payResult(){if(!TXN||!ROOM)return;$('#sheet').style.display='flex';
$('#box').innerHTML='<div style="text-align:center;padding:20px"><div style="font-size:44px">⏳</div><h3>Confirming your payment…</h3><p class="note">Please do not close this page.</p></div>';
let n=0;const show=(icon,title,body)=>{$('#box').innerHTML='<div style="text-align:center;padding:20px"><div style="font-size:44px">'+icon+'</div><h3>'+title+'</h3><p>'+body+'</p><button class="btn" id="dn">Back to menu</button></div>';$('#dn').onclick=()=>{closeCart();try{history.replaceState(null,'',location.pathname+'?room='+encodeURIComponent(ROOM)+(KEY?'&k='+encodeURIComponent(KEY):''))}catch(e){}}};
const chk=()=>api({api:'payStatus',room:ROOM,k:KEY,txnid:TXN}).then(j=>{
if(j.status==='ORDERED'){for(const k in cart)delete cart[k];render();return show('✅','Payment successful','Paid '+rs2(j.total)+' (incl. GST)<br>Room '+esc(ROOM)+' · Order #'+esc(j.orderNo)+'<br><span class="note">The kitchen has your order. Please allow about 30 minutes.</span>')}
if(j.status==='CHECK MANUALLY')return show('🕑','Payment received','Our team will confirm your order shortly. If you do not hear back in 10 minutes, please call reception.');
const why=j.reason?'<br><b>Reason:</b> '+esc(j.reason):'';
if(j.status==='FAILED')return show('❌','Payment failed','Your order was NOT sent to the kitchen.'+why+'<br><span class="note">You can try again. If money was deducted, your bank returns it automatically.</span>');
if(j.status==='EXPIRED')return show('⏱️','Payment not completed','Your order was NOT sent to the kitchen.'+why+'<br><span class="note">You can try again.</span>');
if(++n<40)return new Promise(z=>setTimeout(z,3000)).then(chk);
show('🕑','Still confirming','Your payment is still being confirmed. Please call reception if your order does not arrive.')})

// ---- Guest login (name + phone), once per phone for 24h ----
const GKEY='qrGuest';
function getGuest(){try{const g=JSON.parse(localStorage.getItem(GKEY)||'null');if(g&&Date.now()-g.ts<864e5)return g}catch(e){}return null}
$('#gGo').onclick=()=>{const n=$('#gName').value.trim(),p=$('#gPhone').value.replace(/\D/g,'');const err=$('#gErr'),b=$('#gGo');err.textContent='';
if(n.length<2){err.textContent='Please enter your name.';return}
if(!/^[6-9]\d{9}$/.test(p)){err.textContent='Please enter a valid 10-digit mobile number.';return}
b.disabled=true;b.textContent='Please wait…';
api({api:'login',name:n,phone:p,room:ROOM,k:KEY}).then(()=>{try{localStorage.setItem(GKEY,JSON.stringify({name:n,phone:p,ts:Date.now()}))}catch(e){}$('#login').style.display='none'})
.catch(e=>{b.disabled=false;b.textContent='Continue to menu';err.textContent=e.message||'Could not save. Please try again.'});};
if(!getGuest())$('#login').style.display='flex';

MENU=order.map(c=>({cat:c,items:by[c]}));buildAll();drawTabs();render();}
